server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Archivos con huella en el nombre: caché larga. Datos y HTML: revalidar siempre.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /data/   { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        client_max_body_size 16m;
    }
    location / { try_files $uri $uri/ /index.html; }
}
